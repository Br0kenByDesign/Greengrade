# Fonts and the status page stylesheet are also used by the status page (another origin).
map $uri $gg_cors {
    ~^/design/  "*";
    default     "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    access_log off;   # no IP addresses are logged

    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Access-Control-Allow-Origin $gg_cors always;   # empty = header not sent

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri.html $uri/ =404;
    }
    location /design/ {
        expires 30d;
    }
    location = /design/status.css {
        expires 1h;
    }
    location ~ /\. { deny all; }
}

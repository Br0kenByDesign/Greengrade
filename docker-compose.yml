# greengrade: app (API + web app), db (Postgres), landing (static page).
# Put any reverse proxy with TLS in front: app -> e.g. app.example.com, landing -> e.g. example.com.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: greengrade
      POSTGRES_USER: greengrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greengrade -d greengrade"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    security_opt: ["no-new-privileges:true"]

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: greengrade-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://greengrade:${POSTGRES_PASSWORD}@db:5432/greengrade?sslmode=disable
      DATA_DIR: /data
      LISTEN_ADDR: ":8080"
      GOMEMLIMIT: 600MiB          # Go frees memory before the container limit is reached
    volumes:
      - photos:/data
      - ./secrets:/run/secrets:ro   # optional, e.g. Microsoft Graph certificate
    networks: [internal, proxy]
    # Without a dockerized reverse proxy: remove "proxy" above and publish the port locally instead
    # ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 200

  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
      args:
        APP_URL: ${APP_ORIGIN:?APP_ORIGIN fehlt in .env}
        STATUS_URL: ${STATUS_URL:-}
    image: greengrade-landing:latest
    restart: unless-stopped
    networks: [proxy]
    # ports: ["127.0.0.1:8081:8080"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m

  # Optional status page (Gatus). Enable with COMPOSE_PROFILES=status in .env.
  status:
    profiles: [status]
    build:
      context: .
      dockerfile: gatus/Dockerfile
    image: greengrade-status:latest
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN}
      LANDING_URL: ${LANDING_URL:?LANDING_URL fehlt in .env}
    volumes:
      - status:/data
    networks: [proxy]       # reaches app:8080 and landing:8080 directly, and the public URLs
    # ports: ["127.0.0.1:8082:8080"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

networks:
  internal:
    internal: true          # database is never reachable from outside
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}   # docker network your reverse proxy is attached to

volumes:
  db:
  photos:
  status:
